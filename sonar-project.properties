sonar.projectKey=pyraixyz_pyrai
sonar.organization=pyraixyz

sonar.python.version=3.8,3.9,3.10

sonar.sources=pyrai
sonar.tests=tests
sonar.coverage.exclusions=tests/**,docs/**,examples/**
sonar.python.coverage.reportPaths=coverage.xml

sonar.sourceEncoding=UTF-8

sonar.python.pylint=/usr/local/bin/pylint
sonar.python.pylint_config=.pylintrc

sonar.cpd.exclusions=tests/**
sonar.cpd.python.minimumLines=5
sonar.cpd.python.minimumTokens=70

sonar.python.xunit.reportPath=test-reports/*.xml
sonar.python.xunit.skipDetails=false

sonar.verbose=false 