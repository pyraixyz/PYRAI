[tox]
envlist = py38, py39, py310, lint, type
isolated_build = True

[testenv]
deps =
    -r requirements.txt
    -r requirements-dev.txt
commands =
    pytest tests/ --cov=pyrai --cov-report=xml

[testenv:lint]
deps =
    black
    isort
    flake8
commands =
    black pyrai tests
    isort pyrai tests
    flake8 pyrai tests

[testenv:type]
deps =
    mypy
    types-PyYAML
    types-requests
commands =
    mypy pyrai

[flake8]
max-line-length = 88
extend-ignore = E203
exclude = .tox,*.egg,build,data
select = E,W,F

[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra -q --cov=pyrai --cov-report=term-missing

[coverage:run]
source = pyrai
omit = tests/*

[isort]
profile = black
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
ensure_newline_before_comments = True
line_length = 88 