apiVersion: v1
kind: ConfigMap
metadata:
  name: pyrai-config
  namespace: staging
data:
  PYRAI_ENV: staging
  PYRAI_DEBUG: "false"
  PYRAI_LOG_LEVEL: INFO
  PYRAI_HOST: "0.0.0.0"
  PYRAI_PORT: "8000"
  PYRAI_WORKERS: "4"
  
  # Database
  POSTGRES_HOST: postgres-staging
  POSTGRES_PORT: "5432"
  
  # Redis
  REDIS_HOST: redis-staging
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  
  # CORS
  CORS_ORIGINS: "https://staging.pyrai.xyz"
  
  # Security
  JWT_ALGORITHM: HS256
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  
  # Monitoring
  PROMETHEUS_ENABLED: "true"
  GRAFANA_ENABLED: "true"
  
  # Feature Flags
  FEATURE_EXPERIMENTAL: "false"
  FEATURE_BETA: "false" 