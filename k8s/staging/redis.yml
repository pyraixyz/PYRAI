apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-staging
  namespace: staging
spec:
  serviceName: redis-staging
  replicas: 1
  selector:
    matchLabels:
      app: redis
      env: staging
  template:
    metadata:
      labels:
        app: redis
        env: staging
    spec:
      containers:
        - name: redis
          image: redis:alpine
          command: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-staging
  namespace: staging
spec:
  ports:
    - port: 6379
  selector:
    app: redis
    env: staging 