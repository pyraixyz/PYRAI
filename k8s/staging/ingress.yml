apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pyrai-staging
  namespace: staging
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  tls:
    - hosts:
        - staging.pyrai.xyz
      secretName: pyrai-staging-tls
  rules:
    - host: staging.pyrai.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pyrai-staging
                port:
                  number: 80 