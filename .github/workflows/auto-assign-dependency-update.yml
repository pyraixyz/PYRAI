name: Update Dependencies

on:
  schedule:
    - cron: '0 0 * * 1'  # Run weekly on Monday
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install

      - name: Check for updates
        id: updates
        run: |
          # Get outdated packages
          poetry show --outdated --no-dev > outdated.txt
          
          # Create branch name
          echo "BRANCH_NAME=dependency-updates-$(date +%Y%m%d)" >> $GITHUB_ENV
          
          # Set output for PR creation
          if [ -s outdated.txt ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
          fi

      - name: Create update branch
        if: steps.updates.outputs.has_updates == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b ${{ env.BRANCH_NAME }}

      - name: Update dependencies
        if: steps.updates.outputs.has_updates == 'true'
        run: poetry update

      - name: Run tests
        if: steps.updates.outputs.has_updates == 'true'
        run: |
          poetry run pytest
          echo "TESTS_PASSED=true" >> $GITHUB_ENV

      - name: Create Pull Request
        if: steps.updates.outputs.has_updates == 'true' && env.TESTS_PASSED == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(deps): update dependencies'
          title: '⬆️ Update dependencies'
          body: |
            Automated dependency updates
            
            Updated packages:
            ```
            $(cat outdated.txt)
            ```
            
            <details>
            <summary>Changelog</summary>
            
            $(poetry show --outdated --no-dev)
            </details>
          branch: ${{ env.BRANCH_NAME }}
          base: main
          labels: dependencies,automated
          draft: false

      - name: Process results
        if: always()
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            
            let report = '## Dependency Update Report\n\n';
            
            if (fs.existsSync('outdated.txt')) {
              const outdated = fs.readFileSync('outdated.txt', 'utf8');
              if (outdated.trim()) {
                report += '### 📦 Outdated Packages\n\n```\n' + outdated + '\n```\n\n';
              } else {
                report += '✅ All dependencies are up to date!\n\n';
              }
            }
            
            if (process.env.TESTS_PASSED === 'true') {
              report += '✅ Tests passed with updated dependencies\n\n';
            } else if (process.env.TESTS_PASSED === 'false') {
              report += '❌ Tests failed with updated dependencies\n\n';
            }
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Dependency Update Report - ${new Date().toISOString().split('T')[0]}`,
              body: report,
              labels: ['dependencies', 'automated']
            }); 