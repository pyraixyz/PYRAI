name: Test Matrix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
          pip install pytest pytest-xdist pytest-timeout

      - name: Run tests
        run: |
          pytest -n auto --timeout=300 --junitxml=test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: test-results.xml

      - name: Process test results
        if: always()
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const xml2js = require('xml2js');
            
            const testXml = fs.readFileSync('test-results.xml', 'utf8');
            const parser = new xml2js.Parser();
            const results = await parser.parseStringPromise(testXml);
            
            const testsuites = results.testsuites.testsuite[0];
            const report = `## Test Results for ${{ matrix.os }} - Python ${{ matrix.python-version }}
            
            - Total Tests: ${testsuites.$.tests}
            - Passed: ${testsuites.$.tests - testsuites.$.failures - testsuites.$.errors}
            - Failed: ${testsuites.$.failures}
            - Errors: ${testsuites.$.errors}
            - Skipped: ${testsuites.$.skipped}
            - Time: ${testsuites.$.time}s
            
            ${testsuites.$.failures > 0 || testsuites.$.errors > 0 ? '### Failed Tests\n\n' + 
              testsuites.testcase
                .filter(test => test.failure || test.error)
                .map(test => `- ${test.$.name}: ${(test.failure || test.error)[0]._}`)
                .join('\n')
              : ''}`;
            
            if (context.eventName === 'pull_request') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: report
              });
            } 