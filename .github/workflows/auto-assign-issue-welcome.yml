name: Welcome New Contributors

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Thanks for opening your first issue in this project!
            
            Please make sure you've followed our issue template and provided all necessary information.
            A maintainer will review your issue soon.
            
            In the meantime:
            - Check out our [contributing guidelines](CONTRIBUTING.md)
            - Browse our [documentation](https://pyrai.readthedocs.io/)
            - Join our [community discussions](https://github.com/yourusername/pyrai/discussions)
            
            We appreciate your contribution! 🙏
            
          pr-message: |
            🎉 Thanks for opening your first pull request in this project!
            
            Please ensure:
            - Your PR title follows [conventional commits](https://www.conventionalcommits.org/)
            - You've added tests for your changes
            - Documentation is updated if needed
            - All CI checks pass
            
            A maintainer will review your PR soon. They may suggest some changes or improvements.
            
            Thank you for contributing! 💪 