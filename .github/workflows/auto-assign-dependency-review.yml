name: Dependency Review

on:
  pull_request:
    paths:
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'Dockerfile'
      - '.github/workflows/auto-assign-dependency-review.yml'

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Review dependencies
        uses: actions/dependency-review-action@v3
        with:
          fail-on-severity: high
          deny-licenses: |
            GPL-1.0-only
            GPL-2.0-only
            GPL-3.0-only
          allow-licenses: |
            MIT
            Apache-2.0
            BSD-2-Clause
            BSD-3-Clause
            ISC
            Python-2.0

      - name: Check for outdated dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit --requirement requirements.txt --format json > audit-results.json || true

      - name: Process dependency review
        uses: actions/github-script@v6
        if: always()
        with:
          script: |
            const fs = require('fs');
            const auditResults = JSON.parse(fs.readFileSync('audit-results.json', 'utf8'));
            
            let report = '## Dependency Review Results\n\n';
            
            if (auditResults.vulnerabilities.length > 0) {
              report += '### Vulnerabilities Found\n\n';
              auditResults.vulnerabilities.forEach(vuln => {
                report += `- ${vuln.package_name} ${vuln.current_version}\n`;
                report += `  - ID: ${vuln.id}\n`;
                report += `  - Severity: ${vuln.severity}\n`;
                report += `  - Fixed in: ${vuln.fixed_version}\n\n`;
              });
            } else {
              report += '✅ No vulnerabilities found\n';
            }
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: report
            }); 