name: Secret Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

      - name: Process scan results
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            const comment = `## ⚠️ Potential Secrets Detected

            Secrets scanning has detected potential sensitive information in this PR.
            Please review the scan results and ensure no secrets are being committed.

            ### Best Practices
            1. Remove any hardcoded secrets
            2. Use environment variables
            3. Store secrets in GitHub Secrets
            4. Rotate any exposed credentials

            For more information, see our [security guidelines](SECURITY.md).`;
            
            if (context.eventName === 'pull_request') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            } 