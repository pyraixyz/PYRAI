name: Benchmark Comparison

on:
  pull_request:
    paths:
      - 'pyrai/**'
      - 'benchmarks/**'
      - '.github/workflows/auto-assign-benchmark-compare.yml'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13-alpine
        env:
          POSTGRES_DB: pyrai_test
          POSTGRES_USER: pyrai_test
          POSTGRES_PASSWORD: pyrai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[benchmark]"

      - name: Run benchmarks
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: pyrai_test
          POSTGRES_USER: pyrai_test
          POSTGRES_PASSWORD: pyrai_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          PYRAI_ENV: test
        run: |
          pytest benchmarks/ --benchmark-only --benchmark-json output.json

      - name: Download previous benchmark data
        uses: actions/cache@v3
        with:
          path: ./cache
          key: ${{ runner.os }}-benchmark

      - name: Compare benchmarks
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'pytest'
          output-file-path: output.json
          external-data-json-path: ./cache/benchmark-data.json
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: true
          auto-push: true

      - name: Store benchmark result
        uses: actions/cache@v3
        if: always()
        with:
          path: ./cache
          key: ${{ runner.os }}-benchmark
          restore-keys: |
            ${{ runner.os }}-benchmark 