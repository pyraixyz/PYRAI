name: License Check

on:
  pull_request:
    paths:
      - '**/*.py'
      - 'LICENSE'
      - 'setup.py'
      - 'pyproject.toml'

jobs:
  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install licensecheck python-debian

      - name: Check license headers
        id: headers
        run: |
          find . -type f -name "*.py" -not -path "./venv/*" -not -path "./build/*" -exec \
          sh -c 'echo "Checking $1"; grep -L "Copyright" "$1"' sh {} \; > missing_headers.txt

      - name: Check dependencies licenses
        id: dependencies
        run: |
          pip install -r requirements.txt
          licensecheck --json > licenses.json

      - name: Process results
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            
            let report = '## License Check Report\n\n';
            
            // Check files missing license headers
            const missingHeaders = fs.readFileSync('missing_headers.txt', 'utf8').trim();
            if (missingHeaders) {
              report += '### ⚠️ Files Missing License Headers\n\n```\n' + 
                missingHeaders.split('\n').map(f => `- ${f}`).join('\n') + 
                '\n```\n\n';
            }
            
            // Check dependency licenses
            const licenses = JSON.parse(fs.readFileSync('licenses.json', 'utf8'));
            const problematicLicenses = ['GPL', 'AGPL', 'LGPL'];
            
            const issues = [];
            for (const [pkg, info] of Object.entries(licenses)) {
              if (problematicLicenses.some(l => info.license.includes(l))) {
                issues.push(`- ${pkg}: ${info.license}`);
              }
            }
            
            if (issues.length > 0) {
              report += '### ⚠️ Problematic Dependency Licenses\n\n' +
                       issues.join('\n') + '\n\n' +
                       'These licenses may be incompatible with the project license.\n\n';
            }
            
            // Add comment to PR
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: report
            });
            
            // Fail if there are any issues
            if (missingHeaders || issues.length > 0) {
              core.setFailed('License check failed');
            } 