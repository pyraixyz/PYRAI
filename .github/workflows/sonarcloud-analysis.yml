name: SonarCloud Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 1'  # Run weekly on Monday

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
          pip install coverage pytest pytest-cov

      - name: Run tests with coverage
        run: |
          pytest --cov=pyrai --cov-report=xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=your-org
            -Dsonar.projectKey=your-project
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.sources=pyrai
            -Dsonar.tests=tests
            -Dsonar.python.version=3.8,3.9,3.10,3.11

      - name: Process Analysis Results
        if: always()
        uses: actions/github-script@v6
        with:
          script: |
            const response = await fetch(
              `https://sonarcloud.io/api/measures/component?component=your-project&metricKeys=bugs,vulnerabilities,code_smells,coverage,duplicated_lines_density`
            );
            
            const data = await response.json();
            const measures = data.component.measures;
            
            const report = `## SonarCloud Analysis Results
            
            ### Quality Gate
            ${measures.find(m => m.metric === 'quality_gate_details').value}
            
            ### Metrics
            - Bugs: ${measures.find(m => m.metric === 'bugs').value}
            - Vulnerabilities: ${measures.find(m => m.metric === 'vulnerabilities').value}
            - Code Smells: ${measures.find(m => m.metric === 'code_smells').value}
            - Coverage: ${measures.find(m => m.metric === 'coverage').value}%
            - Duplicated Lines: ${measures.find(m => m.metric === 'duplicated_lines_density').value}%
            
            [View detailed report](https://sonarcloud.io/dashboard?id=your-project)`;
            
            if (context.eventName === 'pull_request') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: report
              });
            } 