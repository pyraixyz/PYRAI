name: Documentation Check

on:
  pull_request:
    paths:
      - 'docs/**'
      - '**.md'
      - '**.rst'
      - 'mkdocs.yml'
      - '.github/workflows/auto-assign-docs-check.yml'

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
          pip install doc8 rstcheck

      - name: Check RST syntax
        run: |
          doc8 docs/
          rstcheck docs/

      - name: Build documentation
        run: |
          mkdocs build --strict

      - name: Check links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'yes'
          folder-path: 'docs/'
          file-path: './README.md, ./CONTRIBUTING.md, ./CODE_OF_CONDUCT.md'
          config-file: '.github/workflows/mlc_config.json'

      - name: Deploy preview
        uses: peaceiris/actions-gh-pages@v3
        if: github.event_name == 'pull_request'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          destination_dir: pr-preview/${{ github.event.pull_request.number }}

      - name: Comment PR
        uses: actions/github-script@v6
        if: github.event_name == 'pull_request'
        with:
          script: |
            const prNumber = context.issue.number;
            const message = `📚 Documentation preview available at: https://${context.repo.owner}.github.io/${context.repo.repo}/pr-preview/${prNumber}/`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: message
            }); 