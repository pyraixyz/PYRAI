name: Auto Assign Projects

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

jobs:
  assign_project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v0.5.0
        with:
          project-url: https://github.com/orgs/pyraixyz/projects/1
          github-token: ${{ secrets.PROJECT_TOKEN }}
          labeled: bug, enhancement, documentation
          label-operator: OR 