name: Spell Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  spell-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install codespell pyspelling

      - name: Run codespell
        run: |
          codespell --write-changes --ignore-words=.github/spellcheck-ignore.txt > spell-check.txt || true

      - name: Process spell check results
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            
            const spellCheckOutput = fs.readFileSync('spell-check.txt', 'utf8');
            
            if (spellCheckOutput.trim()) {
              const report = `## Spell Check Results

              The following spelling issues were found:

              \`\`\`
              ${spellCheckOutput}
              \`\`\`

              Please fix these spelling errors. You can:
              1. Correct the spelling
              2. Add words to \`.github/spellcheck-ignore.txt\` if they are valid terms
              `;
              
              if (context.eventName === 'pull_request') {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: report
                });
              }
              
              core.setFailed('Spell check failed');
            }

      - name: Upload spell check results
        uses: actions/upload-artifact@v3
        with:
          name: spell-check-results
          path: spell-check.txt 