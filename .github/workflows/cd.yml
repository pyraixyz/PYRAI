name: CD

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        context: .
        file: deployment/Dockerfile
        push: true
        tags: |
          pyrai/api:latest
          pyrai/api:${{ github.ref_name }}
        cache-from: type=registry,ref=pyrai/api:buildcache
        cache-to: type=registry,ref=pyrai/api:buildcache,mode=max

  deploy-k8s:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up kubectl
      uses: azure/setup-kubectl@v4
      
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-west-2
        
    - name: Update kubeconfig
      run: aws eks update-kubeconfig --name pyrai-cluster
      
    - name: Deploy to Kubernetes
      run: |
        kubectl set image deployment/pyrai-api api=pyrai/api:${{ github.ref_name }}
        kubectl rollout status deployment/pyrai-api 