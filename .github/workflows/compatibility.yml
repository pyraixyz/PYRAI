name: Compatibility Tests

on:
  schedule:
    - cron: '0 0 * * 0'  # Run weekly
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.8", "3.9", "3.10"]
        pytorch-version: ["1.9.0", "1.10.0", "1.11.0"]
        tensorflow-version: ["2.6.0", "2.7.0", "2.8.0"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch==${{ matrix.pytorch-version }}
        pip install tensorflow==${{ matrix.tensorflow-version }}
        pip install -e ".[dev]"

    - name: Run tests
      run: |
        pytest tests/compatibility/

    - name: Report status
      if: always()
      uses: ravsamhq/notify-slack-action@v1
      with:
        status: ${{ job.status }}
        notification_title: "Compatibility Test Results"
        message_format: "Compatibility test for Python ${{ matrix.python-version }}, PyTorch ${{ matrix.pytorch-version }}, TensorFlow ${{ matrix.tensorflow-version }} on ${{ matrix.os }}: {status}"
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }} 