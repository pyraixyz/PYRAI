name: Performance Monitoring

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - 'pyrai/core/**'
      - 'pyrai/blockchain/**'
      - 'benchmarks/**'

jobs:
  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest-benchmark memory_profiler psutil

      - name: Run performance tests
        run: |
          pytest benchmarks/ --benchmark-only --benchmark-json benchmark.json

      - name: Run memory profiling
        run: |
          python -m memory_profiler benchmarks/memory_profile.py > memory_profile.txt

      - name: Analyze results
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const benchmark = JSON.parse(fs.readFileSync('benchmark.json', 'utf8'));
            const memoryProfile = fs.readFileSync('memory_profile.txt', 'utf8');
            
            let performanceReport = '## Performance Test Results\n\n';
            
            // Add benchmark results
            performanceReport += '### Benchmark Results\n\n';
            benchmark.benchmarks.forEach(test => {
              performanceReport += `- ${test.name}:\n`;
              performanceReport += `  - Mean: ${test.stats.mean.toFixed(6)}s\n`;
              performanceReport += `  - Min: ${test.stats.min.toFixed(6)}s\n`;
              performanceReport += `  - Max: ${test.stats.max.toFixed(6)}s\n\n`;
            });
            
            // Add memory profile
            performanceReport += '### Memory Profile\n\n```\n' + memoryProfile + '\n```\n';
            
            // Create or update performance report
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Performance Report - ${new Date().toISOString().split('T')[0]}`,
              body: performanceReport,
              labels: ['performance', 'report']
            });

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: performance-data
          path: |
            benchmark.json
            memory_profile.txt 