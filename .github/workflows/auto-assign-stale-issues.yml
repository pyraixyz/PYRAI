name: Mark Stale Issues and PRs

on:
  schedule:
    - cron: '0 0 * * *'  # Run daily
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v8
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          
          # Issue settings
          days-before-issue-stale: 60
          days-before-issue-close: 7
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            recent activity. It will be closed if no further activity occurs. Thank you
            for your contributions.
          stale-issue-label: 'stale'
          exempt-issue-labels: 'security,pinned,bug,enhancement'
          
          # PR settings
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has not had
            recent activity. It will be closed if no further activity occurs. Thank you
            for your contributions.
          stale-pr-label: 'stale'
          exempt-pr-labels: 'dependencies,security'
          
          # General settings
          exempt-all-milestones: true
          operations-per-run: 100
          remove-stale-when-updated: true
          debug-only: false
          
          # Custom comments
          close-issue-message: >
            This issue has been automatically closed because it has not had recent activity.
            Please feel free to reopen it if you believe it still needs attention.
          close-pr-message: >
            This pull request has been automatically closed because it has not had recent activity.
            Please feel free to reopen it if you would like to continue working on it. 