name: Update Dependency Graph

on:
  push:
    branches: [ main ]
    paths:
      - 'requirements*.txt'
      - 'setup.py'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  update-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pipdeptree graphviz

      - name: Generate dependency graph
        run: |
          pipdeptree --graph-output dot > deps.dot
          dot -Tsvg deps.dot -o dependency-graph.svg

      - name: Update wiki
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            
            // Read the SVG file
            const graph = fs.readFileSync('dependency-graph.svg', 'utf8');
            
            // Update wiki page
            await github.rest.repos.createOrUpdatePageContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'Dependency-Graph.md',
              message: 'Update dependency graph',
              content: Buffer.from(`# Dependency Graph\n\n${graph}`).toString('base64'),
              branch: 'main'
            });

      - name: Upload graph
        uses: actions/upload-artifact@v3
        with:
          name: dependency-graph
          path: dependency-graph.svg 