name: Container Scan

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/auto-assign-container-scan.yml'
  schedule:
    - cron: '0 0 * * 0'  # Run weekly

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build image
        run: docker build -t pyrai:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: pyrai:${{ github.sha }}
          format: 'json'
          output: 'trivy-results.json'
          severity: 'CRITICAL,HIGH'

      - name: Run Dockle
        uses: goodwithtech/dockle-action@v1
        with:
          image: pyrai:${{ github.sha }}
          format: 'json'
          output: 'dockle-results.json'

      - name: Process scan results
        uses: actions/github-script@v6
        if: always()
        with:
          script: |
            const fs = require('fs');
            
            function readResults(file) {
              try {
                return JSON.parse(fs.readFileSync(file, 'utf8'));
              } catch (e) {
                return null;
              }
            }
            
            const trivyResults = readResults('trivy-results.json');
            const dockleResults = readResults('dockle-results.json');
            
            let report = '## Container Security Scan Results\n\n';
            let hasIssues = false;
            
            if (trivyResults && trivyResults.Results) {
              const vulns = trivyResults.Results.flatMap(r => r.Vulnerabilities || []);
              if (vulns.length > 0) {
                hasIssues = true;
                report += '### Vulnerabilities Found\n\n';
                vulns.forEach(v => {
                  report += `- [${v.Severity}] ${v.VulnerabilityID}: ${v.Title}\n`;
                  report += `  - Package: ${v.PkgName} (${v.InstalledVersion})\n`;
                  report += `  - Fixed Version: ${v.FixedVersion}\n`;
                });
              }
            }
            
            if (dockleResults && dockleResults.details) {
              const issues = dockleResults.details.filter(d => d.level === 'WARN' || d.level === 'FATAL');
              if (issues.length > 0) {
                hasIssues = true;
                report += '\n### Best Practice Violations\n\n';
                issues.forEach(i => {
                  report += `- [${i.level}] ${i.code}: ${i.title}\n`;
                  report += `  - ${i.description}\n`;
                });
              }
            }
            
            if (!hasIssues) {
              report += '✅ No security issues found\n';
            }
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: report
            });
            
            if (hasIssues) {
              core.setFailed('Container security issues found');
            }

      - name: Upload scan results
        uses: actions/upload-artifact@v3
        with:
          name: container-scan-results
          path: |
            trivy-results.json
            dockle-results.json 