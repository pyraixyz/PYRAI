name: Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - 'pyrai/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.github/workflows/auto-assign-security-scan.yml'
  schedule:
    - cron: '0 0 * * 0'  # Run weekly

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety pysa
          pip install -e .

      - name: Run Bandit
        run: |
          bandit -r pyrai -f json -o bandit-results.json

      - name: Check dependencies
        run: |
          safety check --json > safety-results.json

      - name: Run PYSA
        run: |
          pysa analyze pyrai --output pysa-results.json

      - name: Process security results
        uses: actions/github-script@v6
        if: always()
        with:
          script: |
            const fs = require('fs');
            
            function readResults(file) {
              try {
                return JSON.parse(fs.readFileSync(file, 'utf8'));
              } catch (e) {
                return null;
              }
            }
            
            const banditResults = readResults('bandit-results.json');
            const safetyResults = readResults('safety-results.json');
            const pysaResults = readResults('pysa-results.json');
            
            let report = '## Security Scan Results\n\n';
            let hasIssues = false;
            
            if (banditResults && banditResults.results.length > 0) {
              hasIssues = true;
              report += '### Bandit Issues\n\n';
              banditResults.results.forEach(issue => {
                report += `- [${issue.issue_severity}] ${issue.issue_text}\n`;
                report += `  - File: ${issue.filename}:${issue.line_number}\n`;
              });
            }
            
            if (safetyResults && safetyResults.vulnerabilities.length > 0) {
              hasIssues = true;
              report += '\n### Dependency Issues\n\n';
              safetyResults.vulnerabilities.forEach(vuln => {
                report += `- ${vuln.package}: ${vuln.vulnerability}\n`;
              });
            }
            
            if (pysaResults && pysaResults.issues.length > 0) {
              hasIssues = true;
              report += '\n### PYSA Issues\n\n';
              pysaResults.issues.forEach(issue => {
                report += `- ${issue.message}\n`;
                report += `  - File: ${issue.filename}:${issue.line}\n`;
              });
            }
            
            if (!hasIssues) {
              report += '✅ No security issues found\n';
            }
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: report
            });
            
            if (hasIssues) {
              core.setFailed('Security issues found');
            }

      - name: Upload scan results
        uses: actions/upload-artifact@v3
        with:
          name: security-scan-results
          path: |
            bandit-results.json
            safety-results.json
            pysa-results.json 