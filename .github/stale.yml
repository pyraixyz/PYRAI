# Configuration for probot-stale - https://github.com/probot/stale

# Number of days of inactivity before an issue/PR becomes stale
daysUntilStale: 60

# Number of days of inactivity before a stale issue/PR is closed
daysUntilClose: 7

# Issues/PRs with these labels will never be considered stale
exemptLabels:
  - pinned
  - security
  - bug
  - enhancement
  - help wanted

# Label to use when marking an issue/PR as stale
staleLabel: stale

# Comment to post when marking an issue as stale
markComment: >
  This issue has been automatically marked as stale because it has not had
  recent activity. It will be closed if no further activity occurs. Thank you
  for your contributions.

# Comment to post when closing a stale issue
closeComment: >
  This issue has been automatically closed due to inactivity. Please feel free
  to reopen it if you still experience the issue or need assistance.

# Limit to only 'issues' or 'pulls'
only: issues

# Set to true to ignore issues with an assignee
exemptAssignees: true

# Label to use when marking a pull request as stale
stalePrLabel: stale

# Comment to post when marking a pull request as stale
markPrComment: >
  This pull request has been automatically marked as stale because it has not had
  recent activity. It will be closed if no further activity occurs. Thank you
  for your contributions.

# Comment to post when closing a stale pull request
closePrComment: >
  This pull request has been automatically closed due to inactivity. Please feel free
  to reopen it if you would like to continue working on it.

# Limit the number of actions per hour
limitPerRun: 30

# Set to true to process only pull requests
pulls: true 