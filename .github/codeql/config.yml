name: "PyRAI CodeQL Config"

queries:
  - uses: security-and-quality
  - uses: security-extended

paths:
  - pyrai
  - tests
paths-ignore:
  - '**/test/**'
  - '**/tests/**'
  - '**/*.test.py'
  - '**/vendor/**'
  - '**/node_modules/**'
  - 'docs/**'

query-filters:
  - exclude:
      problem.severity:
        - warning
        - recommendation
  - exclude:
      tags: 
        - "security/experimental"

extraction:
  python:
    python_setup:
      version: 3.10 