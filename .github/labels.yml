# Issue Types
- name: bug
  color: d73a4a
  description: Something isn't working
- name: enhancement
  color: a2eeef
  description: New feature or request
- name: documentation
  color: 0075ca
  description: Documentation improvements
- name: question
  color: d876e3
  description: Further information is requested

# Priorities
- name: priority/critical
  color: b60205
  description: Must be fixed ASAP
- name: priority/high
  color: d93f0b
  description: Should be fixed in next release
- name: priority/medium
  color: fbca04
  description: Should be fixed soon
- name: priority/low
  color: 0e8a16
  description: Nice to have

# Status
- name: needs-triage
  color: c5def5
  description: Needs maintainer review
- name: needs-info
  color: c5def5
  description: More information needed
- name: needs-reproduction
  color: c5def5
  description: Bug needs to be reproduced
- name: stale
  color: ffffff
  description: No recent activity

# Size
- name: size/XS
  color: 009900
  description: <10 lines changed
- name: size/S
  color: 77bb00
  description: <50 lines changed
- name: size/M
  color: eebb00
  description: <200 lines changed
- name: size/L
  color: ee9900
  description: <500 lines changed
- name: size/XL
  color: ee5500
  description: <1000 lines changed
- name: size/XXL
  color: ee0000
  description: >1000 lines changed

